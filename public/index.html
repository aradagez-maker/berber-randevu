<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8102E"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="İlhan Randevu">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>İlhan Kuzu Randevu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Düzen: dükkân tabelası gibi kırmızı-beyaz; üstte gün şeridi, solda büyük saat listesi, sağda "sıradaki" panosu */
:root {
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F6F7F9;
  --ink: #15181D;
  --muted: #5B636E;
  --line: #D3D8DE;
  --red: #C8102E;
  --red-ink: #A10C24;
  --red-soft: #FBE5E8;
  --on-red: #FFFFFF;
  --ok: #17703F;
  --ok-soft: #DDF2E5;
  --warn: #8A5A00;
  --warn-soft: #FFF1D1;
  --shadow: 0 1px 2px rgba(21,24,29,.06), 0 4px 14px rgba(21,24,29,.06);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  --font-body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1013; --surface: #191C21; --surface-2: #14171B; --ink: #F1F3F5; --muted: #9AA3AE; --line: #2B3038;
    --red: #E2384F; --red-ink: #FF6B7E; --red-soft: #3B151B; --on-red: #FFFFFF;
    --ok: #52C784; --ok-soft: #12301F; --warn: #F2C063; --warn-soft: #33270E;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1013; --surface: #191C21; --surface-2: #14171B; --ink: #F1F3F5; --muted: #9AA3AE; --line: #2B3038;
  --red: #E2384F; --red-ink: #FF6B7E; --red-soft: #3B151B; --on-red: #FFFFFF;
  --ok: #52C784; --ok-soft: #12301F; --warn: #F2C063; --warn-soft: #33270E;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 20px; line-height: 1.35; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

.wrap { padding-inline: clamp(16px, 2.4vw, 32px); padding-block: 0 40px; max-width: 1600px; margin: 0 auto; }

/* Üst bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { width: 74px; height: 74px; flex: none; }
.brand-text { min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }
.brand-sub { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .14em; color: var(--red); text-transform: uppercase; }
.clock { margin-left: auto; text-align: right; }
.clock-time { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-date { color: var(--muted); font-size: 18px; }
.top-actions { display: flex; gap: 10px; align-items: center; }

.btn { border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 700; font-size: 22px; min-height: 60px; display: inline-flex; align-items: center; gap: 10px; justify-content: center; }
.btn-red { background: var(--red); color: var(--on-red); }
.btn-red:hover { filter: brightness(1.06); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-ok { background: var(--ok); color: var(--surface); }
.btn-danger { background: transparent; color: var(--red-ink); border: 2px solid var(--red); }
.btn-plus { font-size: 34px; line-height: 0; margin-top: -4px; }
.icon-btn { width: 60px; height: 60px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 26px; }

/* Gün şeridi */
.daybar { display: flex; align-items: stretch; gap: 10px; margin-block: 16px 14px; }
.days { display: grid; grid-auto-flow: column; grid-auto-columns: 132px; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; flex: 1; min-width: 0; padding-bottom: 6px; scrollbar-width: thin; }
.day { scroll-snap-align: start; }
.day .mon { display: none; }
.day { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 12px; text-align: left; display: grid; gap: 2px; min-height: 108px; }
.day:hover { border-color: var(--muted); }
.day .dn { font-size: 17px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.day .dd { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.day .dm { font-size: 16px; color: var(--muted); }
.day .dc { font-size: 16px; font-weight: 700; }
.day .dc.zero { color: var(--muted); font-weight: 500; }
.day.today .dn { color: var(--red); }
.day.sel { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.day.sel .dn, .day.sel .dm, .day.sel .dc { color: var(--bg); opacity: .85; }
.day.closed { background: var(--surface-2); }
.day .ds, .day .dcs { display: none; }
@media (max-width: 900px) {
  .days { grid-auto-columns: 54px; gap: 6px; }
  .day .mon { display: block; font-size: 12px; font-weight: 700; color: var(--red); text-transform: uppercase; line-height: 1; }
  .day.sel .mon { color: var(--bg); }
  .daybar { gap: 6px; }
  .day { min-height: 0; padding: 8px 2px; text-align: center; justify-items: center; border-radius: 10px; }
  .day .dn, .day .dm, .day .dc { display: none; }
  .day .ds { display: block; font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .day.today .ds { color: var(--red); }
  .day.sel .ds, .day.sel .dcs { color: var(--bg); }
  .day .dd { font-size: 28px; }
  .day { padding: 8px 0; }
  .day .dcs { display: grid; place-items: center; min-width: 26px; height: 26px; border-radius: 999px; background: var(--red); color: var(--on-red); font-size: 15px; font-weight: 700; }
  .day .dcs.zero { background: transparent; color: var(--muted); }
  .daybar .nav-btn { width: 34px; font-size: 24px; border-radius: 10px; }
}
.move-bar { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--red); color: var(--on-red); border-radius: 12px; padding: 12px 16px; font-size: 20px; font-weight: 600; }
.move-bar span { flex: 1; min-width: 200px; }
.move-bar button { background: var(--surface); color: var(--ink); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 18px; min-height: 48px; }
.slot.free.target { border-color: var(--red); background: var(--red-soft); }
.slot.free.target .what { color: var(--red-ink); font-weight: 700; }
.slot.booked.moving { outline: 4px dashed var(--red); outline-offset: 2px; }
.week .c.target:hover, .week .c.target { background: var(--red-soft); }
.nav-btn { flex: none; width: 60px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); font-size: 30px; font-weight: 700; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 10px 22px; font-weight: 700; font-size: 20px; min-height: 50px; }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--on-red); }
.day-title { font-family: var(--font-display); font-weight: 700; font-size: 34px; text-transform: uppercase; letter-spacing: .02em; margin: 0 auto 0 6px; text-wrap: balance; }
.sync { font-size: 15px; color: var(--muted); }

/* Ana alan */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr); } .aside { order: -1; } }
.main.wide { grid-template-columns: minmax(0, 1fr); }
.main.wide .aside { display: none; }

.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 116px minmax(0, 1fr) auto; align-items: center; gap: 16px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 16px; min-height: 84px; text-align: left; width: 100%; }
.slot .t { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.slot .t small { display: block; font-size: 17px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.slot.free { background: var(--surface-2); border-style: dashed; }
.slot.free .what { color: var(--muted); font-size: 22px; }
.slot.free:hover { border-color: var(--red); border-style: solid; }
.slot.free:hover .what { color: var(--red-ink); }
.slot.booked { border-color: var(--red); border-left-width: 10px; box-shadow: var(--shadow); }
.slot.booked .who { font-size: 30px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.slot.booked .meta { color: var(--muted); font-size: 19px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.slot.cont { min-height: 56px; background: var(--red-soft); border-color: transparent; padding-block: 6px; }
.slot.cont .t { font-size: 28px; color: var(--muted); }
.slot.cont .what { color: var(--red-ink); font-size: 19px; font-weight: 600; }
.slot.past { opacity: .5; }
.slot.past.booked { opacity: .75; }
.slot.now { outline: 4px solid var(--red); outline-offset: 2px; opacity: 1; }
.now-tag { display: inline-block; background: var(--red); color: var(--on-red); font-weight: 700; font-size: 14px; letter-spacing: .1em; padding: 2px 8px; border-radius: 6px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 14px; font-size: 17px; font-weight: 700; white-space: nowrap; }
.chip.dur { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.chip.came { background: var(--ok-soft); color: var(--ok); }
.chip.noshow { background: var(--warn-soft); color: var(--warn); }
.right-col { display: grid; gap: 6px; justify-items: end; }

.closed-banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 14px 18px; font-weight: 600; margin-bottom: 10px; }

/* Yan panel */
.aside { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); }
@media (max-width: 1100px) { .aside { position: static; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
.card { background: var(--surface); border-radius: var(--radius); border: 2px solid var(--line); padding: 18px 20px; }
.card h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.next-card { background: var(--red); border-color: var(--red); color: var(--on-red); }
.next-card h3 { color: var(--on-red); opacity: .85; }
.next-time { font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.next-who { font-size: 30px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.next-in { font-size: 20px; opacity: .9; margin-top: 4px; }
.stat-row { display: flex; justify-content: space-between; align-items: baseline; padding-block: 6px; border-bottom: 1px solid var(--line); }
.stat-row:last-child { border-bottom: 0; }
.stat-row b { font-family: var(--font-display); font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }

/* Hafta görünümü */
.week-wrap { overflow-x: auto; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); }
.week { display: grid; min-width: 900px; }
.week .h { position: sticky; top: 0; background: var(--surface); padding: 10px 8px; text-align: center; border-bottom: 2px solid var(--line); font-weight: 700; }
.week .h .hn { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.week .h .hd { font-family: var(--font-display); font-size: 30px; line-height: 1; }
.week .h.today .hn { color: var(--red); }
.week .tl { font-family: var(--font-display); font-weight: 700; font-size: 22px; padding: 6px 10px; color: var(--muted); border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.week .c { border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-height: 52px; padding: 4px; background: transparent; border-right: 0; border-bottom: 0; text-align: left; }
.week .c:hover { background: var(--surface-2); }
.week .c.past { background: var(--surface-2); }
.week .c.closedc { background: var(--surface-2); }
.week .b { display: block; background: var(--red); color: var(--on-red); border-radius: 8px; padding: 5px 8px; font-size: 16px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
.week .b.contb { background: var(--red-soft); color: var(--red-ink); font-weight: 600; }
.week .b.came { background: var(--ok); }

/* Pencere */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10,12,15,.55); display: grid; place-items: start center; overflow-y: auto; padding: 24px 16px; }
.modal { background: var(--surface); color: var(--ink); width: min(760px, 100%); border-radius: 18px; padding: 24px clamp(16px, 3vw, 30px) 26px; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: grid; gap: 18px; }
.modal h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 38px; text-transform: uppercase; letter-spacing: .02em; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 700; font-size: 18px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field input, .field select, .field textarea { background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 26px; min-height: 64px; width: 100%; }
.field textarea { min-height: 90px; font-size: 22px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--red); outline: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .top { position: static; } .row2 { grid-template-columns: 1fr; } .slot { grid-template-columns: 84px minmax(0,1fr); } .slot .right-col { grid-column: 1 / -1; justify-items: start; grid-auto-flow: column; justify-content: start; } .slot .t { font-size: 32px; } .brand-name { font-size: 28px; } .clock-time { font-size: 40px; } }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips button { border: 2px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 10px 20px; font-size: 21px; font-weight: 600; min-height: 54px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.modal-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; position: sticky; bottom: -26px; background: var(--surface); padding-block: 14px 26px; margin-bottom: -26px; border-top: 1px solid var(--line); }
.modal-actions .spacer { flex: 1; }
.msg { border-radius: 12px; padding: 12px 16px; font-weight: 600; }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.err { background: var(--red-soft); color: var(--red-ink); }
.status-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.status-btns button { border: 2px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 18px; font-weight: 700; font-size: 20px; min-height: 54px; }
.status-btns button[aria-pressed="true"].s-came { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.status-btns button[aria-pressed="true"].s-noshow { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.status-btns button[aria-pressed="true"].s-wait { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.days-check { display: flex; flex-wrap: wrap; gap: 10px; }
.days-check label { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 20px; font-weight: 600; color: var(--ink); text-transform: none; letter-spacing: 0; }
.days-check input { width: 24px; height: 24px; min-height: 0; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 14px 24px; border-radius: 12px; font-weight: 700; z-index: 80; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .slot, .day { transition: border-color .15s, background-color .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <path id="lg-top" d="M 26 100 A 74 74 0 0 1 174 100"/>
          <path id="lg-bot" d="M 22 100 A 78 78 0 0 0 178 100"/>
        </defs>
        <circle cx="100" cy="100" r="97" fill="#C8102E"/>
        <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle cx="100" cy="100" r="62" fill="#FFFFFF"/>
        <circle cx="100" cy="100" r="57" fill="none" stroke="#15181D" stroke-width="1"/>
        <text font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="3.2" fill="#FFFFFF" text-anchor="middle"><textPath href="#lg-top" startOffset="50%">AKSOY ERKEK KUAFÖRÜ</textPath></text>
        <text font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="600" font-size="13" letter-spacing="4" fill="#FFFFFF" text-anchor="middle" dominant-baseline="hanging"><textPath href="#lg-bot" startOffset="50%">• RANDEVU •</textPath></text>
        <circle cx="20" cy="100" r="3" fill="#FFFFFF"/>
        <circle cx="180" cy="100" r="3" fill="#FFFFFF"/>
        <g stroke="#C8102E" stroke-width="4" stroke-linecap="round" fill="none">
          <line x1="93" y1="74" x2="112" y2="47"/>
          <line x1="107" y1="74" x2="88" y2="47"/>
          <circle cx="90.5" cy="79" r="5.5"/>
          <circle cx="109.5" cy="79" r="5.5"/>
        </g>
        <circle cx="100" cy="62" r="2.2" fill="#15181D"/>
        <text x="100" y="125" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="1" fill="#15181D" text-anchor="middle">İLHAN</text>
        <rect x="62" y="131" width="76" height="2" fill="#C8102E"/>
        <text x="100" y="150" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="600" font-size="16" letter-spacing="7" fill="#15181D" text-anchor="middle">KUZU</text>
      </svg>
      <div class="brand-text">
        <div class="brand-name">İlhan Kuzu</div>
        <div class="brand-sub">Aksoy Erkek Kuaförü</div>
      </div>
    </div>
    <div class="clock">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate"></div>
    </div>
    <div class="top-actions">
      <button class="btn btn-red" id="newBtn" type="button"><span class="btn-plus">+</span> Randevu</button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Çalışma saatleri" title="Çalışma saatleri">⚙</button>
    </div>
    <div class="move-bar" id="moveBar" hidden></div>
  </header>

  <div class="daybar">
    <button class="nav-btn" id="prevWeek" type="button" aria-label="Önceki günler">‹</button>
    <div class="days" id="days"></div>
    <button class="nav-btn" id="nextWeek" type="button" aria-label="Sonraki günler">›</button>
  </div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Görünüm">
      <button type="button" id="vDay" aria-pressed="true">Gün</button>
      <button type="button" id="vWeek" aria-pressed="false">Hafta</button>
    </div>
    <button class="btn btn-ghost" id="todayBtn" type="button" style="min-height:58px;font-size:20px;padding:10px 18px">Bugün</button>
    <h1 class="day-title" id="dayTitle"></h1>
    <span class="sync" id="sync">Yükleniyor…</span>
  </div>

  <div class="main" id="mainGrid">
    <section id="viewArea" aria-live="polite"></section>
    <aside class="aside" id="aside"></aside>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modal"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const DAY_NAMES = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const DAY_SHORT = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
  const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const SERVICES = ["Saç", "Sakal", "Saç + Sakal", "Çocuk", "Yıkama", "Fön", "Ense / Düzeltme"];
  const LS_APPTS = "ik-randevu-appts", LS_SET = "ik-randevu-settings";

  const DEFAULT_SETTINGS = { open: "09:00", close: "21:00", step: 30, closed: [] };

  const keyOf = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const dateOf = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const toMin = (t) => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
  const fromMin = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
  const mondayOf = (k) => { const d = dateOf(k); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return keyOf(d); };
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const todayKey = () => keyOf(new Date());
  const longDate = (k) => { const d = dateOf(k); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + DAY_NAMES[d.getDay()]; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const newId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

  // ---------- Durum ----------
  const state = {
    sel: todayKey(),
    view: "day",
    appts: new Map(),
    settings: { ...DEFAULT_SETTINGS },
    mode: "pending", // pending | db | local
    readOnly: false,
    moving: null,
  };
  try { const v = localStorage.getItem("ik-view"); if (v === "week" || v === "day") state.view = v; } catch {}

  // ---------- Depolama (paylaşılan veritabanı, yoksa bu cihaz) ----------
  let db = null;
  let resolveReady;
  const ready = new Promise((r) => (resolveReady = r));

  function useLocal() {
    state.mode = "local";
    const arr = lsGet(LS_APPTS, []);
    state.appts = new Map(arr.map((a) => [a.id, a]));
    state.settings = { ...DEFAULT_SETTINGS, ...lsGet(LS_SET, {}) };
    $("sync").textContent = "Bu cihaza kaydediliyor";
    resolveReady();
    render();
  }
  function saveLocal() { lsSet(LS_APPTS, [...state.appts.values()]); lsSet(LS_SET, state.settings); }

  // ---------- Kendi sunucusu (Railway) ----------
  let pin = ""; try { pin = localStorage.getItem("ik-pin") || ""; } catch {}
  let pinMode = false, polling = false;
  async function api(method, path, body) {
    const r = await fetch("/api" + path, { method, headers: { "content-type": "application/json", "x-pin": pin }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
    if (r.status === 401) { const e = new Error("pin"); e.code = "pin"; throw e; }
    if (!r.ok) { const e = new Error("http " + r.status); e.code = "http"; throw e; }
    return r.json();
  }
  // Her cihaz son listeyi kendinde de saklar; sunucu boş açılırsa buradan geri yüklenir
  function saveCache() { lsSet("ik-cache", { appts: [...state.appts.values()], settings: state.settings, at: Date.now() }); }
  async function tryRestore(newPin) {
    const c = lsGet("ik-cache", null);
    try {
      const r = await fetch("/api/restore", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin: newPin || pin, appts: (c && c.appts) || [], settings: (c && c.settings) || null }), cache: "no-store" });
      if (!r.ok) return false;
      const j = await r.json();
      if (newPin) pin = newPin;
      try { localStorage.setItem("ik-pin", pin); } catch {}
      if (j.restored) setTimeout(() => toast(j.restored + " randevu bu cihazdaki yedekten geri yüklendi"), 600);
      return true;
    } catch { return false; }
  }
  async function recoverOrAsk() {
    try {
      const j = await (await fetch("/api/ping", { cache: "no-store" })).json();
      if (j.setup) { if (pin.length >= 4 && (await tryRestore())) return startApi(); return askPin(false, true); }
    } catch {}
    askPin();
  }
  async function apiLoad() {
    const st = await api("GET", "/state");
    state.appts = new Map((st.appts || []).map((a) => [a.id, a]));
    state.settings = { ...DEFAULT_SETTINGS, ...(st.settings || {}) };
    saveCache();
    $("sync").textContent = "Kayıtlı · tüm cihazlarda";
    render();
  }
  async function startApi() {
    try { await apiLoad(); }
    catch (e) { if (e.code === "pin") return recoverOrAsk(); $("sync").textContent = "Sunucuya ulaşılamadı, tekrar deneniyor…"; }
    resolveReady();
    if (!polling) {
      polling = true;
      setInterval(() => { if (document.visibilityState === "visible" && !pinMode) apiLoad().catch((e) => { if (e.code === "pin") recoverOrAsk(); else $("sync").textContent = "Bağlantı yok, tekrar deneniyor…"; }); }, 8000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !pinMode) apiLoad().catch(() => {}); });
    }
  }
  let setupMode = false;
  function askPin(wrong, setup) {
    pinMode = true; setupMode = !!setup;
    $("modal").innerHTML = `<h2 id="mTitle">${setup ? "Şifre belirleyin" : "Dükkân şifresi"}</h2>
      ${setup ? `<div>Uygulamayı ilk kez açıyorsunuz. Randevuları korumak için en az 4 haneli bir şifre belirleyin. Bu şifreyi İlhan'a da söyleyin.</div>` : ""}
      <div class="field"><label for="pinIn">${setup ? "Yeni şifre" : "Şifreyi girin"}</label><input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password"></div>
      ${wrong ? `<div class="msg err">${setup ? "Şifre en az 4 haneli olmalı." : "Şifre yanlış, tekrar deneyin."}</div>` : ""}
      <div class="modal-actions"><button type="button" class="btn btn-red" id="pinOk">Giriş</button></div>`;
    $("overlay").hidden = false;
    setTimeout(() => $("pinIn") && $("pinIn").focus(), 30);
  }
  async function submitPin() {
    pin = $("pinIn").value.trim();
    if (setupMode) {
      if (pin.length < 4) return askPin(true, true);
      await tryRestore(pin); // bu cihazda yedek varsa randevular da geri gelir
    }
    try { await api("GET", "/state"); } catch (e) { return askPin(true); }
    try { localStorage.setItem("ik-pin", pin); } catch {}
    pinMode = false; $("overlay").hidden = true;
    startApi();
  }

  async function initStore() {
    if (!window.claude || typeof window.claude.use !== "function") {
      if (location.protocol.startsWith("http")) {
        try {
          const r = await fetch("/api/ping", { cache: "no-store" });
          const j = r.ok ? await r.json() : null;
          if (j && j.app === "ik-randevu") { state.mode = "api"; $("sync").textContent = "Bağlanıyor…"; return j.setup ? ((pin.length >= 4 && (await tryRestore())) ? startApi() : askPin(false, true)) : startApi(); }
        } catch {}
      }
      return useLocal();
    }
    let ns = null;
    try { ns = await window.claude.use("db"); } catch { ns = null; }
    if (!ns) return useLocal();
    // Yazma izni olmayan (hesapsız ya da sadece bakabilen) kişi kendi cihazına kaydetsin
    try {
      const u = await window.claude.use("user");
      if (u && typeof u.can === "function" && (await u.can("data.write")) === false) return useLocal();
    } catch {}
    db = ns;
    state.mode = "db";
    state.appts = new Map();
    $("sync").textContent = "Bağlanıyor…";
    const since = addDays(todayKey(), -60);
    db.collection("appts").where("date", ">=", since).onSnapshot((snap) => {
      const m = new Map();
      snap.docs.forEach((d) => { const v = d.data(); if (v) m.set(d.id, { ...v, id: d.id }); });
      state.appts = m;
      $("sync").textContent = snap.metadata.fromCache ? "Eşitleniyor…" : "Kayıtlı · tüm cihazlarda";
      render();
    }, () => { $("sync").textContent = "Bağlantı kesildi, sayfayı yenileyin"; });
    db.doc("config/shop").onSnapshot((d) => {
      state.settings = { ...DEFAULT_SETTINGS, ...(d.exists ? d.data() : {}) };
      render();
    }, () => {});
    resolveReady();
    render();
  }

  async function writeAppt(a) {
    await ready;
    const clean = { date: a.date, time: a.time, dur: a.dur, name: a.name, phone: a.phone || "", service: a.service || "", note: a.note || "", status: a.status || "wait", createdAt: a.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
    if (state.mode === "db") {
      await db.collection("appts").doc(a.id).set(clean);
    } else if (state.mode === "api") {
      await api("PUT", "/appts/" + encodeURIComponent(a.id), clean);
      state.appts.set(a.id, { ...clean, id: a.id }); saveCache(); render();
    } else {
      state.appts.set(a.id, { ...clean, id: a.id });
      saveLocal(); render();
    }
  }
  async function deleteAppt(id) {
    await ready;
    if (state.mode === "db") await db.collection("appts").doc(id).delete();
    else if (state.mode === "api") { await api("DELETE", "/appts/" + encodeURIComponent(id)); state.appts.delete(id); saveCache(); render(); }
    else { state.appts.delete(id); saveLocal(); render(); }
  }
  async function writeSettings(s) {
    await ready;
    if (state.mode === "db") await db.doc("config/shop").set(s);
    else if (state.mode === "api") { await api("PUT", "/settings", s); state.settings = s; saveCache(); render(); }
    else { state.settings = s; saveLocal(); render(); }
  }
  function writeErr(e) {
    if (e && e.code === "pin") return recoverOrAsk();
    if (e && e.code === "invalid_argument") { state.readOnly = true; toast("Bu sayfada değişiklik yapma yetkiniz yok."); }
    else if (e && e.code === "quota_exceeded") toast("Kayıt alanı doldu. Eski randevuları silin.");
    else toast("Kaydedilemedi, bağlantıyı kontrol edip tekrar deneyin.");
  }

  // ---------- Hesaplar ----------
  function isClosed(k) { return (state.settings.closed || []).includes(dateOf(k).getDay()); }
  function slotTimes() {
    const s = state.settings, out = [];
    const step = Math.max(10, Number(s.step) || 30);
    for (let m = toMin(s.open); m < toMin(s.close); m += step) out.push(m);
    return out;
  }
  function apptsOn(k) {
    return [...state.appts.values()].filter((a) => a.date === k).sort((x, y) => toMin(x.time) - toMin(y.time));
  }
  function rowsFor(k) {
    const step = Math.max(10, Number(state.settings.step) || 30);
    const list = apptsOn(k);
    const times = slotTimes();
    // Çalışma saati dışındaki randevular da görünsün
    list.forEach((a) => { const m = toMin(a.time); if (!times.some((t) => m >= t && m < t + step)) times.push(m - (m % step)); });
    times.sort((a, b) => a - b);
    const uniq = [...new Set(times)];
    const rows = [];
    uniq.forEach((m) => {
      const starting = list.filter((a) => { const s = toMin(a.time); return s >= m && s < m + step; });
      if (starting.length) starting.forEach((a) => rows.push({ type: "booked", m: toMin(a.time), slot: m, a }));
      else {
        const cover = list.find((a) => { const s = toMin(a.time); return s < m && s + (a.dur || step) > m; });
        rows.push(cover ? { type: "cont", m, slot: m, a: cover } : { type: "free", m, slot: m });
      }
    });
    return rows;
  }
  function conflicts(k, start, dur, ignoreId) {
    return apptsOn(k).filter((a) => a.id !== ignoreId && a.status !== "noshow" && toMin(a.time) < start + dur && toMin(a.time) + (a.dur || 30) > start);
  }
  function durText(min) { if (min < 60) return min + " dk"; const h = Math.floor(min / 60), r = min % 60; return h + " sa" + (r ? " " + r + " dk" : ""); }
  function firstFree(k) {
    const step = Math.max(10, Number(state.settings.step) || 30);
    const isToday = k === todayKey(), n = nowMin();
    for (const m of slotTimes()) { if (isToday && m + step <= n) continue; if (!conflicts(k, m, step).length) return m; }
    return slotTimes()[0] ?? 540;
  }

  // ---------- Çizim ----------
  function renderClock() {
    const d = new Date();
    $("clockTime").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("clockDate").textContent = longDate(todayKey());
  }

  function dayRange() {
    const t = todayKey();
    let start = addDays(t, -14), end = addDays(t, 120);
    if (state.sel < addDays(start, 7)) start = addDays(state.sel, -14);
    if (state.sel > addDays(end, -30)) end = addDays(state.sel, 60);
    const out = [];
    for (let k = start; k <= end; k = addDays(k, 1)) out.push(k);
    return out;
  }
  function renderDays() {
    const t = todayKey();
    let html = "";
    dayRange().forEach((k, i) => {
      const d = dateOf(k);
      const n = apptsOn(k).length, closed = isClosed(k);
      const cls = ["day", k === t ? "today" : "", k === state.sel ? "sel" : "", closed ? "closed" : ""].join(" ");
      const label = k === t ? "Bugün" : DAY_NAMES[d.getDay()];
      html += `<button type="button" class="${cls}" data-day="${k}" aria-pressed="${k === state.sel}">
        <span class="mon">${d.getDate() === 1 || i === 0 ? MONTHS[d.getMonth()].slice(0, 3) : "&nbsp;"}</span><span class="dn">${label}</span><span class="ds">${DAY_SHORT[d.getDay()]}</span>
        <span class="dd">${d.getDate()}</span>
        <span class="dm">${MONTHS[d.getMonth()]}</span>
        <span class="dc ${n ? "" : "zero"}">${closed && !n ? "Kapalı" : n ? n + " randevu" : "Boş"}</span><span class="dcs ${n ? "" : "zero"}">${closed && !n ? "–" : n ? n : "·"}</span>
      </button>`;
    });
    const box = $("days"), sl = box.scrollLeft;
    box.innerHTML = html;
    box.scrollLeft = sl;
  }

  function statusChip(a) {
    if (a.status === "came") return `<span class="chip came">Geldi ✓</span>`;
    if (a.status === "noshow") return `<span class="chip noshow">Gelmedi</span>`;
    return "";
  }

  function renderDayView() {
    const k = state.sel, t = todayKey(), n = nowMin();
    const step = Math.max(10, Number(state.settings.step) || 30);
    const rows = rowsFor(k);
    const mv = state.moving ? state.appts.get(state.moving) : null;
    let html = isClosed(k) ? `<div class="closed-banner">Bu gün dükkân kapalı olarak ayarlı. Yine de randevu ekleyebilirsiniz.</div>` : "";
    if (!rows.length) html += `<div class="card">Çalışma saati ayarlanmamış. Sağ üstteki ⚙ düğmesinden açılış ve kapanış saatini girin.</div>`;
    html += `<div class="slots">`;
    rows.forEach((r) => {
      const endM = r.type === "booked" ? r.m + (r.a.dur || step) : r.slot + step;
      const past = k < t || (k === t && endM <= n);
      const isNow = k === t && r.type !== "cont" && n >= r.m && n < endM && !(r.type === "free" && rows.some((x) => x !== r && x.type === "booked" && n >= x.m && n < x.m + (x.a.dur || step)));
      const cls = ["slot", r.type, past ? "past" : "", isNow ? "now" : ""].join(" ");
      const nowTag = isNow ? `<span class="now-tag">ŞİMDİ</span>` : "";
      if (r.type === "booked") {
        const a = r.a;
        html += `<button type="button" class="${cls}${mv && mv.id === a.id ? " moving" : ""}" data-edit="${esc(a.id)}">
          <span class="t">${fromMin(r.m)}<small>${fromMin(r.m + (a.dur || step))}'e kadar</small>${nowTag}</span>
          <span><span class="who">${esc(a.name)}</span><span class="meta">${a.service ? `<span>${esc(a.service)}</span>` : ""}${a.phone ? `<span>${esc(a.phone)}</span>` : ""}${a.note ? `<span>“${esc(a.note)}”</span>` : ""}</span></span>
          <span class="right-col"><span class="chip dur">${durText(a.dur || step)}</span>${statusChip(a)}</span>
        </button>`;
      } else if (r.type === "cont") {
        html += `<button type="button" class="${cls}" data-edit="${esc(r.a.id)}">
          <span class="t">${fromMin(r.m)}</span>
          <span class="what">↳ ${esc(r.a.name)} devam ediyor</span><span></span>
        </button>`;
      } else {
        html += `<button type="button" class="${cls}${mv ? " target" : ""}" data-new="${fromMin(r.m)}">
          <span class="t">${fromMin(r.m)}${nowTag}</span>
          <span class="what">${mv ? "Buraya taşı" : "Boş · randevu eklemek için dokunun"}</span>
          <span class="right-col"><span class="chip dur">${mv ? "Taşı" : "+ Ekle"}</span></span>
        </button>`;
      }
    });
    html += `</div>`;
    $("viewArea").innerHTML = html;
  }

  function renderWeekView() {
    const start = mondayOf(state.sel), t = todayKey(), n = nowMin();
    const step = Math.max(10, Number(state.settings.step) || 30);
    const keys = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const times = slotTimes();
    keys.forEach((k) => apptsOn(k).forEach((a) => { const m = toMin(a.time); const s = m - (m % step); if (!times.includes(s)) times.push(s); }));
    times.sort((a, b) => a - b);
    let html = `<div class="week-wrap"><div class="week" style="grid-template-columns: 84px repeat(7, minmax(110px, 1fr))"><div class="h"></div>`;
    keys.forEach((k) => { const d = dateOf(k); html += `<div class="h ${k === t ? "today" : ""}"><div class="hn">${k === t ? "Bugün" : DAY_SHORT[d.getDay()]}</div><div class="hd">${d.getDate()}</div></div>`; });
    times.forEach((m) => {
      html += `<div class="tl">${fromMin(m)}</div>`;
      keys.forEach((k) => {
        const list = apptsOn(k);
        const starting = list.filter((a) => { const s = toMin(a.time); return s >= m && s < m + step; });
        const cover = starting.length ? null : list.find((a) => { const s = toMin(a.time); return s < m && s + (a.dur || step) > m; });
        const past = k < t || (k === t && m + step <= n);
        const cls = ["c", past ? "past" : "", isClosed(k) ? "closedc" : ""].join(" ");
        if (starting.length) {
          html += `<button type="button" class="${cls}" data-edit="${esc(starting[0].id)}">${starting.map((a) => `<span class="b ${a.status === "came" ? "came" : ""}">${a.time} ${esc(a.name)}</span>`).join("")}</button>`;
        } else if (cover) {
          html += `<button type="button" class="${cls}" data-edit="${esc(cover.id)}"><span class="b contb">↳ ${esc(cover.name)}</span></button>`;
        } else {
          html += `<button type="button" class="${cls}${state.moving ? " target" : ""}" data-new="${fromMin(m)}" data-date="${k}" aria-label="${longDate(k)} ${fromMin(m)} boş"></button>`;
        }
      });
    });
    html += `</div></div>`;
    $("viewArea").innerHTML = html;
  }

  function renderAside() {
    const t = todayKey(), n = nowMin();
    const upcoming = [...state.appts.values()]
      .filter((a) => a.status !== "noshow" && a.status !== "came" && (a.date > t || (a.date === t && toMin(a.time) + (a.dur || 30) > n)))
      .sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
    const next = upcoming[0];
    let nextHtml;
    if (next) {
      let inTxt;
      if (next.date === t) {
        const diff = toMin(next.time) - n;
        inTxt = diff <= 0 ? "Şu an koltukta" : diff < 60 ? diff + " dakika sonra" : Math.floor(diff / 60) + " saat " + (diff % 60 ? (diff % 60) + " dk " : "") + "sonra";
      } else inTxt = next.date === addDays(t, 1) ? "Yarın" : longDate(next.date);
      nextHtml = `<button type="button" class="card next-card" data-edit="${esc(next.id)}" style="text-align:left;width:100%">
        <h3>Sıradaki</h3><div class="next-time">${next.time}</div><div class="next-who">${esc(next.name)}</div>
        <div class="next-in">${esc(next.service || "")}${next.service ? " · " : ""}${inTxt}</div></button>`;
    } else {
      nextHtml = `<div class="card"><h3>Sıradaki</h3><div style="font-size:22px">Bekleyen randevu yok. Boş bir saate dokunarak ekleyin.</div></div>`;
    }
    const k = state.sel, list = apptsOn(k);
    const step = Math.max(10, Number(state.settings.step) || 30);
    const freeCount = slotTimes().filter((m) => !conflicts(k, m, step).length && !(k === t && m + step <= n) && k >= t).length;
    const came = list.filter((a) => a.status === "came").length;
    const dayLabel = k === t ? "Bugün" : DAY_NAMES[dateOf(k).getDay()];
    $("aside").innerHTML = nextHtml + `<div class="card"><h3>${dayLabel} özeti</h3>
      <div class="stat-row"><span>Randevu</span><b>${list.length}</b></div>
      <div class="stat-row"><span>Gelen</span><b>${came}</b></div>
      <div class="stat-row"><span>Boş saat</span><b>${freeCount}</b></div></div>`;
  }

  let lastSel = null;
  function render() {
    renderClock();
    renderDays();
    $("dayTitle").textContent = state.view === "week" ? weekTitle() : longDate(state.sel);
    $("vDay").setAttribute("aria-pressed", state.view === "day");
    $("vWeek").setAttribute("aria-pressed", state.view === "week");
    $("mainGrid").classList.toggle("wide", state.view === "week");
    $("mainGrid").classList.toggle("wide", state.view === "week" || !!state.moving);
    if (state.view === "week") renderWeekView(); else renderDayView();
    if (lastSel !== state.sel) { lastSel = state.sel; const el = document.querySelector(".day.sel"); const box = $("days"); if (el) box.scrollLeft = el.offsetLeft - box.offsetLeft - (box.clientWidth - el.offsetWidth) / 2; }
    renderAside();
    const mv = state.moving ? state.appts.get(state.moving) : null;
    if (state.moving && !mv) state.moving = null;
    const bar = $("moveBar");
    bar.hidden = !mv;
    if (mv) bar.innerHTML = `<span><b>${esc(mv.name)}</b> (${longDate(mv.date)} ${mv.time}) taşınıyor. Günü seçip boş saate dokunun.</span><button type="button" id="moveCancel">Vazgeç</button>`;
  }
  async function moveTo(date, time) {
    const a = state.appts.get(state.moving);
    if (!a) { state.moving = null; render(); return; }
    const clash = conflicts(date, toMin(time), a.dur || 30, a.id);
    if (clash.length) { toast("Bu saat dolu (" + clash[0].name + " " + clash[0].time + "). Başka saat seçin."); return; }
    state.moving = null;
    state.sel = date;
    try { await writeAppt({ ...a, date, time, status: "wait" }); toast(a.name + " → " + longDate(date) + " " + time + " taşındı"); }
    catch (e) { writeErr(e); }
    render();
  }
  function weekTitle() {
    const s = dateOf(mondayOf(state.sel)), e = dateOf(addDays(mondayOf(state.sel), 6));
    return s.getDate() + (s.getMonth() !== e.getMonth() ? " " + MONTHS[s.getMonth()] : "") + " – " + e.getDate() + " " + MONTHS[e.getMonth()];
  }

  // ---------- Randevu penceresi ----------
  let form = null;
  function openAppt(opts) {
    const step = Math.max(10, Number(state.settings.step) || 30);
    const existing = opts.id ? state.appts.get(opts.id) : null;
    form = existing ? { ...existing } : { id: newId(), date: opts.date || state.sel, time: opts.time || fromMin(firstFree(opts.date || state.sel)), dur: step >= 30 ? step : 30, name: "", phone: "", service: "Saç", note: "", status: "wait" };
    form.isNew = !existing; form.force = false; form.confirmDel = false;
    drawModal();
    $("overlay").hidden = false;
    setTimeout(() => { const el = $("fName"); if (el && form.isNew) el.focus(); }, 30);
  }
  function timeOptions(sel) {
    const step = Math.max(10, Number(state.settings.step) || 30);
    const set = new Set();
    for (let m = 7 * 60; m <= 23 * 60; m += Math.min(step, 15)) set.add(fromMin(m));
    set.add(sel);
    return [...set].sort().map((t) => `<option ${t === sel ? "selected" : ""}>${t}</option>`).join("");
  }
  function drawModal(msg) {
    const f = form;
    const names = [...new Map([...state.appts.values()].filter((a) => a.name).map((a) => [a.name.toLocaleLowerCase("tr"), a])).values()];
    const durs = [15, 30, 45, 60, 90, 120];
    $("modal").innerHTML = `
      <h2 id="mTitle">${f.isNew ? "Yeni randevu" : "Randevu"}</h2>
      <div class="row2">
        <div class="field"><label for="fDate">Gün</label><input id="fDate" type="date" value="${f.date}"></div>
        <div class="field"><label for="fTime">Saat</label><select id="fTime">${timeOptions(f.time)}</select></div>
      </div>
      <div class="field"><label for="fName">Müşteri adı</label><input id="fName" type="text" autocomplete="off" list="nameList" value="${esc(f.name)}" placeholder="Örn. Ahmet Yılmaz">
        <datalist id="nameList">${names.map((a) => `<option value="${esc(a.name)}">`).join("")}</datalist></div>
      <div class="field"><label for="fPhone">Telefon</label><input id="fPhone" type="tel" inputmode="tel" value="${esc(f.phone)}" placeholder="05xx xxx xx xx"></div>
      <div class="field"><span class="lbl">Hizmet</span><div class="chips" id="fService">${SERVICES.map((s) => `<button type="button" data-v="${esc(s)}" aria-pressed="${f.service === s}">${esc(s)}</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Süre</span><div class="chips" id="fDur">${durs.map((d) => `<button type="button" data-v="${d}" aria-pressed="${f.dur === d}">${durText(d)}</button>`).join("")}</div></div>
      ${!f.isNew ? `<div class="field"><span class="lbl">Durum</span><div class="status-btns" id="fStatus">
        <button type="button" class="s-wait" data-v="wait" aria-pressed="${f.status === "wait"}">Bekleniyor</button>
        <button type="button" class="s-came" data-v="came" aria-pressed="${f.status === "came"}">Geldi ✓</button>
        <button type="button" class="s-noshow" data-v="noshow" aria-pressed="${f.status === "noshow"}">Gelmedi</button></div></div>` : ""}
      <div class="field"><label for="fNote">Not</label><textarea id="fNote" placeholder="İsteğe bağlı">${esc(f.note)}</textarea></div>
      ${msg ? `<div class="msg ${msg.kind}">${msg.text}</div>` : ""}
      <div class="modal-actions">
        <button type="button" class="btn btn-red" id="mSave">${f.force ? "Yine de kaydet" : "Kaydet"}</button>
        <button type="button" class="btn btn-ghost" id="mCancel">Vazgeç</button>
        ${!f.isNew ? `<button type="button" class="btn btn-ghost" id="mMove">Başka güne taşı</button>` : ""}
        <span class="spacer"></span>
        ${!f.isNew ? `<button type="button" class="btn btn-danger" id="mDel">${f.confirmDel ? "Evet, sil" : "Randevuyu sil"}</button>` : ""}
      </div>`;
  }
  function readForm() {
    form.date = $("fDate").value || form.date;
    form.time = $("fTime").value;
    form.name = $("fName").value.trim();
    form.phone = $("fPhone").value.trim();
    form.note = $("fNote").value.trim();
  }
  function closeModal() { if (pinMode) return; $("overlay").hidden = true; form = null; }

  async function saveForm() {
    readForm();
    if (!form.name) return drawModal({ kind: "err", text: "Müşteri adını yazın." });
    const clash = conflicts(form.date, toMin(form.time), form.dur, form.id);
    if (clash.length && !form.force) {
      form.force = true;
      return drawModal({ kind: "warn", text: "Bu saatte " + clash.map((a) => esc(a.name) + " (" + a.time + ")").join(", ") + " var. Üst üste kaydetmek için tekrar basın." });
    }
    const a = { ...form };
    const wasNew = form.isNew;
    closeModal();
    state.sel = a.date;
    try { await writeAppt(a); toast(wasNew ? a.time + " – " + a.name + " kaydedildi" : "Randevu güncellendi"); }
    catch (e) { writeErr(e); }
    render();
  }
  async function delForm() {
    if (!form.confirmDel) { readForm(); form.confirmDel = true; return drawModal({ kind: "err", text: "Silmek için tekrar basın." }); }
    const id = form.id, name = form.name;
    closeModal();
    try { await deleteAppt(id); toast(name + " randevusu silindi"); } catch (e) { writeErr(e); }
  }

  // ---------- Ayarlar ----------
  function openSettings() {
    const s = state.settings;
    const hours = []; for (let m = 6 * 60; m <= 24 * 60; m += 30) hours.push(fromMin(m % (24 * 60) === 0 && m ? 23 * 60 + 59 : m));
    const opt = (v) => hours.map((h) => `<option ${h === v ? "selected" : ""}>${h}</option>`).join("");
    const order = [1, 2, 3, 4, 5, 6, 0];
    $("modal").innerHTML = `
      <h2 id="mTitle">Çalışma saatleri</h2>
      <div class="row2">
        <div class="field"><label for="sOpen">Açılış</label><select id="sOpen">${opt(s.open)}</select></div>
        <div class="field"><label for="sClose">Kapanış</label><select id="sClose">${opt(s.close)}</select></div>
      </div>
      <div class="field"><span class="lbl">Randevu aralığı</span><div class="chips" id="sStep">${[15, 20, 30, 45, 60].map((d) => `<button type="button" data-v="${d}" aria-pressed="${Number(s.step) === d}">${d} dk</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Kapalı günler</span><div class="days-check">${order.map((d) => `<label><input type="checkbox" id="sDay${d}" value="${d}" ${(s.closed || []).includes(d) ? "checked" : ""}> ${DAY_NAMES[d]}</label>`).join("")}</div></div>
      <div id="sMsg"></div>
      <div class="modal-actions"><button type="button" class="btn btn-red" id="sSave">Kaydet</button><button type="button" class="btn btn-ghost" id="mCancel">Vazgeç</button></div>`;
    $("overlay").hidden = false;
  }
  async function saveSettings() {
    const open = $("sOpen").value, close = $("sClose").value;
    if (toMin(close) <= toMin(open)) { $("sMsg").innerHTML = `<div class="msg err">Kapanış saati açılıştan sonra olmalı.</div>`; return; }
    const stepBtn = document.querySelector('#sStep button[aria-pressed="true"]');
    const closed = [0, 1, 2, 3, 4, 5, 6].filter((d) => $("sDay" + d).checked);
    const s = { open, close, step: stepBtn ? Number(stepBtn.dataset.v) : 30, closed };
    $("overlay").hidden = true;
    try { await writeSettings(s); toast("Çalışma saatleri kaydedildi"); } catch (e) { writeErr(e); }
  }

  // ---------- Bildirim ----------
  let toastT;
  function toast(text) { const el = $("toast"); el.textContent = text; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 3200); }

  // ---------- Olaylar ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, .overlay");
    if (!t) return;
    if (t.id === "overlay") { if (e.target === t) closeModal(); return; }
    if (t.dataset.day) { state.sel = t.dataset.day; render(); return; }
    if (t.dataset.edit && !t.closest(".modal")) {
      if (state.moving) { toast(t.dataset.edit === state.moving ? "Yeni gün ve boş bir saat seçin." : "Bu saat dolu, boş bir saate dokunun."); return; }
      openAppt({ id: t.dataset.edit }); return;
    }
    if (t.dataset.new !== undefined && state.moving) { moveTo(t.dataset.date || state.sel, t.dataset.new); return; }
    if (t.dataset.new !== undefined && !t.closest(".modal")) { openAppt({ time: t.dataset.new, date: t.dataset.date || state.sel }); return; }
    switch (t.id) {
      case "newBtn": openAppt({}); return;
      case "settingsBtn": openSettings(); return;
      case "prevWeek": case "nextWeek": { const box = $("days"); box.scrollBy({ left: (t.id === "nextWeek" ? 1 : -1) * Math.max(200, box.clientWidth * 0.8), behavior: "smooth" }); return; }
      case "mMove": { const id = form.id; closeModal(); state.moving = id; state.view = "day"; render(); toast("Yeni günü seçip boş saate dokunun"); return; }
      case "moveCancel": state.moving = null; render(); return;
      case "todayBtn": state.sel = todayKey(); render(); return;
      case "vDay": case "vWeek": state.view = t.id === "vDay" ? "day" : "week"; try { localStorage.setItem("ik-view", state.view); } catch {} render(); return;
      case "mCancel": closeModal(); return;
      case "mSave": saveForm(); return;
      case "mDel": delForm(); return;
      case "sSave": saveSettings(); return;
      case "pinOk": submitPin(); return;
    }
    const grp = t.parentElement && t.parentElement.id;
    if (grp === "fService" || grp === "fDur" || grp === "fStatus") {
      readForm();
      if (grp === "fService") form.service = form.service === t.dataset.v ? "" : t.dataset.v;
      if (grp === "fDur") form.dur = Number(t.dataset.v);
      if (grp === "fStatus") form.status = t.dataset.v;
      form.force = false;
      drawModal();
      return;
    }
    if (grp === "sStep") { t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b === t)); }
  });
  document.addEventListener("change", (e) => {
    if (!form) return;
    if (e.target.id === "fName") {
      const v = e.target.value.trim().toLocaleLowerCase("tr");
      const prev = [...state.appts.values()].filter((a) => a.name && a.name.toLocaleLowerCase("tr") === v && a.phone).sort((x, y) => (y.date + y.time).localeCompare(x.date + x.time))[0];
      if (prev && !$("fPhone").value) $("fPhone").value = prev.phone;
    }
    if (e.target.id === "fDate" || e.target.id === "fTime") form.force = false;
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("overlay").hidden) closeModal();
    else if (e.key === "Escape" && state.moving) { state.moving = null; render(); }
    if (e.key === "Enter" && pinMode && e.target.id === "pinIn") { e.preventDefault(); submitPin(); return; }
    if (e.key === "Enter" && form && e.target.tagName === "INPUT") { e.preventDefault(); saveForm(); }
  });

  // Gün görünümünde parmakla sağa/sola kaydırınca gün değişsin
  let sx = 0, sy = 0;
  $("viewArea").addEventListener("touchstart", (e) => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; }, { passive: true });
  $("viewArea").addEventListener("touchend", (e) => {
    if (state.view !== "day") return;
    const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) { state.sel = addDays(state.sel, dx < 0 ? 1 : -1); render(); }
  }, { passive: true });

  // Saat ve "şimdi" çizgisi
  let lastMin = -1;
  setInterval(() => {
    const m = nowMin();
    if (m === lastMin) return;
    lastMin = m;
    if ($("overlay").hidden) render(); else renderClock();
  }, 15000);

  // Ekran açık kalsın (tablette)
  async function keepAwake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  keepAwake();

  render();
  initStore();
})();
</script>
</body></html>

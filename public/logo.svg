<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="600" height="600" role="img" aria-label="İlhan Kuzu – Aksoy Erkek Kuaförü logosu" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="ring-top" d="M 26 100 A 74 74 0 0 1 174 100"/>
    <path id="ring-bottom" d="M 22 100 A 78 78 0 0 0 178 100"/>
  </defs>
  <!-- dış halka: tabeladaki kırmızı -->
  <circle cx="100" cy="100" r="97" fill="#C8102E"/>
  <circle cx="100" cy="100" r="91" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- iç beyaz alan -->
  <circle cx="100" cy="100" r="62" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="57" fill="none" stroke="#15181D" stroke-width="1"/>
  <!-- halka yazıları -->
  <text font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="17" letter-spacing="3.2" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#ring-top" startOffset="50%">AKSOY ERKEK KUAFÖRÜ</textPath>
  </text>
  <text font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="600" font-size="13" letter-spacing="4" fill="#FFFFFF" text-anchor="middle" dominant-baseline="hanging">
    <textPath href="#ring-bottom" startOffset="50%">• RANDEVU •</textPath>
  </text>
  <!-- yıldızlar (yan noktalar) -->
  <circle cx="20" cy="100" r="3" fill="#FFFFFF"/>
  <circle cx="180" cy="100" r="3" fill="#FFFFFF"/>
  <!-- makas -->
  <g stroke="#C8102E" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="93" y1="74" x2="112" y2="47"/>
    <line x1="107" y1="74" x2="88" y2="47"/>
    <circle cx="90.5" cy="79" r="5.5"/>
    <circle cx="109.5" cy="79" r="5.5"/>
  </g>
  <circle cx="100" cy="62" r="2.2" fill="#15181D"/>
  <!-- monogram -->
  <text x="100" y="125" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="700" font-size="44" letter-spacing="1" fill="#15181D" text-anchor="middle">İLHAN</text>
  <rect x="62" y="131" width="76" height="2" fill="#C8102E"/>
  <text x="100" y="150" font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-weight="600" font-size="16" letter-spacing="7" fill="#15181D" text-anchor="middle">KUZU</text>
</svg>
